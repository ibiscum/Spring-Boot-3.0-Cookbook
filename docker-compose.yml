name: spring-boot-cookbook
services:
  postgresql:
    image: postgres:18.3-alpine3.22
    environment:
      POSTGRES_USER: packt
      POSTGRES_PASSWORD: packt
      POSTGRES_DB: football
    ports:
      - '127.0.0.1:5432:5432'
    restart: always

  postgresql2:
    image: postgres:18.3-alpine3.22
    environment:
      POSTGRES_USER: packt
      POSTGRES_PASSWORD: packt
      POSTGRES_DB: football
    ports:
      - '127.0.0.1:5432:5432'
    restart: always

  zipkin:
    image: openzipkin/zipkin:3-amd64
    ports:
      - '9411:9411'
    restart: always
    networks:
      - observability
    # image: ghcr.io/openzipkin/zipkin:${TAG:-latest}
    # # Uncomment to enable request logging (TRACE shows query values)
    # # command: --logging.level.com.datastax.oss.driver.internal.core.tracker.RequestLogger=TRACE
    # depends_on:
    #   zipkin_storage:
    #     condition: service_healthy
    # environment:
    #   - STORAGE_TYPE=mysql
    #   - MYSQL_HOST=zipkin_storage
    #   # Add the baked-in username and password for the zipkin-mysql image
    #   - MYSQL_USER=zipkin
    #   - MYSQL_PASS=zipkin
    #   - JAVA_OPTS=-Xms2g -Xmx2g -XX:+ExitOnOutOfMemoryError
    # ports:
    #   - '127.0.0.1:9411:9411'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4318:4318'   # OTLP HTTP
      - '4317:4317'   # OTLP gRPC
    networks:
      - observability

  mongo:
    image: mongo:7.0.3
    environment:
      MONGO_INITDB_ROOT_USERNAME: packt
      MONGO_INITDB_ROOT_PASSWORD: packt
      MONGO_INITDB_DATABASE: football
    ports:
      - '127.0.0.1:27017:27017'
    restart: always

  cassandra:
    image: cassandra:5.0.8
    environment:
      CASSANDRA_CLUSTER_NAME: football
      CASSANDRA_KEYSPACE: football
      CASSANDRA_USERNAME: packt
      CASSANDRA_PASSWORD: packt
    ports:
      - '127.0.0.1:9042:9042'
    restart: always

  redis:
    image: redis:8.6.3
    ports:
      - '127.0.0.1:16379:6379'

  grafana:
    image: grafana/grafana
    depends_on:
      - prometheus
    ports:
      - '127.0.0.1:3000:3000'

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '127.0.0.1:19090:9090'

  rabbitmq:
    image: rabbitmq:3-management
    hostname: football-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "packt"
      RABBITMQ_DEFAULT_PASS: "packt"

networks:
  observability:
    driver: bridge

# zipkin_storage:
#     image: ghcr.io/openzipkin/zipkin-mysql:${TAG:-latest}
#     container_name: mysql
