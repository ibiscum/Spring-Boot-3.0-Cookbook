management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,env,metrics,beans,loggers,football
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

spring:
  application:
    name: trading-service
  datasource:
    url: jdbc:postgresql://localhost:5432/football
    username: packt
    password: packt
football:
  folder: teams
