# This file uses the version 2 docker-compose file format, described here:
# https://docs.docker.com/compose/compose-file/#version-2
#
# It extends the default configuration from docker-compose.yml to run the
# zipkin-cassandra container instead of the zipkin-mysql container.
name: ch7-recipe7-1-docker-compose
services:
  grafana:
    image: grafana/grafana:main-distroless-slim
    depends_on:
      - prometheus
    ports:
      - '127.0.0.1:3000:3000'
  postgresql:
    image: postgres:16.14-alpine3.23
    container_name: football-db
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=football
      - POSTGRES_USER=packt
      - POSTGRES_PASSWORD=packt
    ports:
      - '127.0.0.1:5432:5432'
    restart: unless-stopped

  prometheus:
    image: cleanstart/prometheus:3.11.0-arm64
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    user: "0:0"

  # Use Cassandra instead of in-memory storage
  zipkin:
    image: ghcr.io/openzipkin/zipkin:${TAG:-latest}
    # Uncomment to enable request logging (TRACE shows query values)
    # command: --logging.level.com.datastax.oss.driver.internal.core.tracker.RequestLogger=TRACE
    depends_on:
      zipkin_storage:
        condition: service_healthy
    environment:
      - STORAGE_TYPE=mysql
      - MYSQL_HOST=zipkin_storage
      # Add the baked-in username and password for the zipkin-mysql image
      - MYSQL_USER=zipkin
      - MYSQL_PASS=zipkin
      - JAVA_OPTS=-Xms2g -Xmx2g -XX:+ExitOnOutOfMemoryError
    ports:
      - '127.0.0.1:9411:9411'
  zipkin_storage:
    image: ghcr.io/openzipkin/zipkin-mysql:${TAG:-latest}
    container_name: mysql

volumes:
  prometheus_data:
  postgres_data:
